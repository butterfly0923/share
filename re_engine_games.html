const tbody = document.querySelector('#t tbody');
let sortKey = 'i', sortAsc = true;
function esc(s) { return String(s).replace(/</g,'&lt;'); }
function render() {
  tbody.innerHTML = DATA.map(r => `<tr>
    <td class="num">${r.i}</td>
    <td>${r.appid ? `<a href="https://store.steampowered.com/app/${r.appid}/" target="_blank">${esc(r.cn)}</a>` : esc(r.cn)}</td>
    <td>${esc(r.en)}</td>
    <td class="num">${r.appid || '—'}</td>
    <td class="num">${r.date || 'TBD'}</td>
    <td>${r.owned ? '<span class="own own-yes">✔ Yes</span>' : '<span class="own own-no">No</span>'}</td>
  </tr>`).join('');
}
function applySort() {
  DATA.sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    const c = (typeof x === 'number') ? x - y : String(x).localeCompare(String(y), 'zh');
    return sortAsc ? c : -c;
  });
  document.querySelectorAll('th .arrow').forEach(e => e.remove());
  const th = document.querySelector(`th[data-k="${sortKey}"]`);
  if (th) th.insertAdjacentHTML('beforeend', `<span class="arrow">${sortAsc ? '▲' : '▼'}</span>`);
  render();
}
document.querySelectorAll('th[data-k]').forEach(th => th.addEventListener('click', () => {
  const k = th.dataset.k;
  if (sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = true; }
  applySort();
}));
applySort();
</script>
